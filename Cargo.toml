[package]
name = "huh"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Plain-language terminal assistant: deterministic local command matching, explanation, and error diagnosis"

[[bin]]
name = "huh"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
