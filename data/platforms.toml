# Package managers and package names per family of Linux systems.
#
# This file is compiled into huh. A copy at ~/.config/huh/platforms.toml (or the
# file named by $HUH_PLATFORMS) is merged on top of it: families are overridden
# field by field, `packages` and `programs` entries are added or replaced.
#
# huh never runs any of these commands. It only prints them.
#
# Adding a distro: add a `[families.<name>]` table (ids, detect, commands) and, where its
# package names differ, add the family to a row of `[packages]`. Nothing else changes.
# Adding a program: add it to `same` if its package has that name on every distro, or
# add a row to `[packages]` (and `[programs]` when the program and package names differ).
#
# Command strings: `{}` marks where the package (or program, or file) goes. Without `{}`
# it is appended at the end.
#
# Rule for unknown programs: a program name is only used as a package name when this
# file says so (`same`, or a `[packages]` row with a `*` entry or an entry for the family).
# Otherwise huh prints the family's `provides` search instead of guessing a package name.
#
# `[packages]` values: a name; "" meaning "this family's repositories have no such package"
# (huh says so and offers its provides search instead of an install that cannot work); or no
# entry at all, meaning "unknown" (huh prints the provides search instead of guessing).
# Availability that depends on the release (a package missing from Debian 11 or Ubuntu 20.04
# but present in newer ones) is NOT modelled per release: the row keeps the current name and
# a `[notes]` row adds a short remark that is printed with the install command, e.g.
#   [notes]
#   eza = { debian = "Debian 11/12 and Ubuntu before 24.04 do not ship it; ..." }

# Programs whose package has the same name on every family below.
same = [
  "htop", "btop", "tmux", "git", "vim", "nano", "tree", "zip", "unzip", "rsync", "wget", "curl",
  "jq", "strace", "lsof", "socat", "ethtool", "fzf", "bat", "eza", "tcpdump",
  "smartmontools", "upower", "ripgrep", "neovim", "pciutils", "usbutils", "traceroute", "mtr",
  "docker-compose", "ncdu", "zsh", "less", "gcc", "whois", "cmake",
  "bubblewrap",
]

# Tools that belong to one distro or package manager. huh never suggests installing them
# with another family's manager (e.g. `apt install pacman`). The package managers named
# in `detect` and in the commands below count as well.
tools = ["omarchy", "yay", "paru", "sudo", "doas", "flatpak", "snap"]

# program -> package key, where they differ. The key is looked up in [packages].
[programs]
rg = "ripgrep"
nvim = "neovim"
ss = "iproute2"
ip = "iproute2"
zbarimg = "zbar"
virsh = "libvirt"
sqlite3 = "sqlite"
convert = "imagemagick"
magick = "imagemagick"
dig = "bind"
nslookup = "bind"
host = "bind"
nc = "openbsd-netcat"
python3 = "python"
pip = "python-pip"
pip3 = "python-pip"
node = "nodejs"
7z = "7zip"
7za = "7zip"
lsusb = "usbutils"
lspci = "pciutils"
lsblk = "util-linux"
lscpu = "util-linux"
dmesg = "util-linux"
mount = "util-linux"
umount = "util-linux"
ps = "procps"
free = "procps"
top = "procps"
pgrep = "procps"
pkill = "procps"
uptime = "procps"
watch = "procps"
nmcli = "networkmanager"
systemctl = "systemd"
journalctl = "systemd"
systemd-inhibit = "systemd"
loginctl = "systemd"
usermod = "shadow"
useradd = "shadow"
groupadd = "shadow"
passwd = "shadow"
modprobe = "kmod"
lsmod = "kmod"
tracepath = "iputils"
ssh = "openssh"
scp = "openssh"
ssh-copy-id = "openssh"
ssh-keygen = "openssh"
gh = "github-cli"
btrfs = "btrfs-progs"
man = "man-db"
xdg-open = "xdg-utils"
fuser = "psmisc"
iostat = "sysstat"
bluetoothctl = "bluez-utils"
udisksctl = "udisks2"
sensors = "lm_sensors"
userdel = "shadow"
wl-copy = "wl-clipboard"
wl-paste = "wl-clipboard"
wpctl = "wireplumber"

# package key -> family -> package name. `*` is the name on every family without its own
# entry; "" means the family has no such package (so huh stays quiet instead of guessing).
# A family that has neither an entry nor `*` is unknown: huh prints the provides search.
# Keys are Arch package names; omarchy inherits arch; `nix` (Nix on another distro) uses the nixos names.
[packages]
ripgrep = { "*" = "ripgrep" }
nmap = { arch = "nmap", debian = "nmap", fedora = "nmap", suse = "nmap", alpine = "nmap", nixos = "nmap", gentoo = "net-analyzer/nmap" }
snapper = { arch = "snapper", debian = "snapper", fedora = "snapper", suse = "snapper", alpine = "", void = "snapper", nixos = "snapper", gentoo = "sys-fs/snapper" }
make = { "*" = "make", nixos = "gnumake" }
iperf3 = { "*" = "iperf3", suse = "iperf" }
fish = { "*" = "fish", void = "fish-shell" }
zbar = { arch = "zbar", debian = "zbar-tools", fedora = "zbar", suse = "zbar", alpine = "zbar", void = "zbar", nixos = "zbar", gentoo = "media-gfx/zbar" }
libvirt = { arch = "libvirt", debian = "libvirt-clients", fedora = "libvirt-client", suse = "libvirt-client", alpine = "libvirt-client", void = "libvirt", nixos = "libvirt", gentoo = "app-emulation/libvirt" }
sqlite = { arch = "sqlite", debian = "sqlite3", fedora = "sqlite", suse = "sqlite3", alpine = "sqlite", void = "sqlite", nixos = "sqlite", gentoo = "dev-db/sqlite" }
imagemagick = { arch = "imagemagick", debian = "imagemagick", fedora = "ImageMagick", suse = "ImageMagick", alpine = "imagemagick", void = "ImageMagick", nixos = "imagemagick", gentoo = "media-gfx/imagemagick" }
fd = { arch = "fd", debian = "fd-find", fedora = "fd-find", suse = "fd", alpine = "fd", void = "fd", nixos = "fd", gentoo = "sys-apps/fd" }
ffmpeg = { "*" = "ffmpeg", fedora = "ffmpeg-free" }
bind = { arch = "bind", debian = "bind9-dnsutils", fedora = "bind-utils", suse = "bind-utils", alpine = "bind-tools", void = "bind-utils", nixos = "bind", gentoo = "net-dns/bind-tools" }
openbsd-netcat = { arch = "openbsd-netcat", debian = "netcat-openbsd", fedora = "nmap-ncat", suse = "netcat-openbsd", alpine = "netcat-openbsd", nixos = "netcat", gentoo = "net-analyzer/openbsd-netcat" }
python = { arch = "python", debian = "python3", fedora = "python3", suse = "python3", alpine = "python3", void = "python3", nixos = "python3", gentoo = "dev-lang/python" }
python-pip = { arch = "python-pip", debian = "python3-pip", fedora = "python3-pip", suse = "python3-pip", alpine = "py3-pip", void = "python3-pip", gentoo = "dev-python/pip" }
nodejs = { arch = "nodejs", debian = "nodejs", fedora = "nodejs", alpine = "nodejs", void = "nodejs", nixos = "nodejs", gentoo = "net-libs/nodejs" }
npm = { arch = "npm", debian = "npm", fedora = "npm", alpine = "npm", nixos = "nodejs" }
"7zip" = { arch = "7zip", debian = "p7zip-full", alpine = "7zip", nixos = "p7zip" }
procps = { arch = "procps-ng", debian = "procps", fedora = "procps-ng", suse = "procps", alpine = "procps-ng", void = "procps-ng", nixos = "procps", gentoo = "sys-process/procps" }
networkmanager = { arch = "networkmanager", debian = "network-manager", fedora = "NetworkManager", suse = "NetworkManager", alpine = "networkmanager-cli", void = "NetworkManager", nixos = "networkmanager", gentoo = "net-misc/networkmanager" }
systemd = { arch = "systemd", debian = "systemd", fedora = "systemd", suse = "systemd", alpine = "", void = "", nixos = "systemd", gentoo = "sys-apps/systemd" }
shadow = { arch = "shadow", debian = "passwd", fedora = "shadow-utils", suse = "shadow", alpine = "shadow", void = "shadow", nixos = "shadow", gentoo = "sys-apps/shadow" }
kmod = { "*" = "kmod", gentoo = "sys-apps/kmod" }
iputils = { arch = "iputils", debian = "iputils-tracepath", fedora = "iputils", suse = "iputils", void = "iputils", nixos = "iputils", gentoo = "net-misc/iputils" }
iproute2 = { "*" = "iproute2", fedora = "iproute", gentoo = "sys-apps/iproute2" }
util-linux = { "*" = "util-linux", gentoo = "sys-apps/util-linux" }
openssh = { arch = "openssh", debian = "openssh-client", fedora = "openssh-clients", suse = "openssh-clients", alpine = "openssh-client", void = "openssh", nixos = "openssh", gentoo = "net-misc/openssh" }
github-cli = { arch = "github-cli", debian = "gh", fedora = "gh", suse = "gh", alpine = "github-cli", void = "github-cli", nixos = "gh", gentoo = "dev-util/github-cli" }
man-db = { arch = "man-db", debian = "man-db", fedora = "man-db", suse = "man", alpine = "mandoc", void = "man-db" }
docker = { arch = "docker", debian = "docker.io", fedora = "docker", suse = "docker", alpine = "docker", void = "docker", nixos = "docker", gentoo = "app-containers/docker" }
btrfs-progs = { "*" = "btrfs-progs", suse = "btrfsprogs", gentoo = "sys-fs/btrfs-progs" }
psmisc = { "*" = "psmisc", gentoo = "sys-process/psmisc" }
sysstat = { "*" = "sysstat", gentoo = "app-admin/sysstat" }
xdg-utils = { "*" = "xdg-utils", gentoo = "x11-misc/xdg-utils" }
unrar = { arch = "unrar", suse = "unrar", alpine = "", nixos = "unrar" }
tailscale = { arch = "tailscale", alpine = "tailscale", void = "tailscale", nixos = "tailscale" }
ollama = { arch = "ollama", nixos = "ollama" }
yay = { "*" = "" }
paru = { "*" = "" }
cargo = { "*" = "cargo", arch = "rust", gentoo = "dev-lang/rust" }
rustc = { "*" = "rustc", arch = "rust", suse = "rust", alpine = "rust", void = "rust", gentoo = "dev-lang/rust" }

# Remarks printed with an install command when the package is missing from some releases of
# the family. package key -> family -> text.
bluez-utils = { arch = "bluez-utils", debian = "bluez", fedora = "bluez", suse = "bluez", alpine = "bluez", void = "bluez", nixos = "bluez", gentoo = "net-wireless/bluez" }
udisks2 = { arch = "udisks2", debian = "udisks2", fedora = "udisks2", suse = "udisks2", alpine = "udisks2", void = "udisks2", nixos = "udisks", gentoo = "sys-fs/udisks" }
lm_sensors = { arch = "lm_sensors", debian = "lm-sensors", fedora = "lm_sensors", suse = "sensors", alpine = "lm-sensors", void = "lm_sensors", nixos = "lm_sensors", gentoo = "sys-apps/lm-sensors" }
wl-clipboard = { "*" = "wl-clipboard", gentoo = "gui-apps/wl-clipboard" }
wireplumber = { "*" = "wireplumber", gentoo = "media-video/wireplumber" }

[notes]
eza = { debian = "eza is not in Debian 11/12 or Ubuntu before 24.04; there, find it with `apt-file search bin/eza` or install it from upstream." }
btop = { debian = "btop is not in Debian 11 or Ubuntu 20.04; on those releases install it from a backport or upstream." }
github-cli = { debian = "gh is not in Debian 11 or Ubuntu 20.04; on those releases use GitHub's own apt repository." }

[families.arch]
ids = ["arch", "archarm", "artix", "manjaro", "endeavouros", "cachyos", "garuda", "arcolinux", "parabola", "blackarch", "steamos", "chimeraos", "archcraft", "rebornos"]
detect = ["pacman"]
install = "sudo pacman -S"
remove = "sudo pacman -Rs"
search = "pacman -Ss"
update = "sudo pacman -Syu"
owns = "pacman -Qo"
provides = "pacman -F {}"
query = "pacman -Q"
list = "pacman -Q"
clean = "sudo pacman -Sc"

[families.omarchy]
extends = "arch"
ids = ["omarchy"]
install = "omarchy pkg add"
remove = "omarchy pkg drop"
# Updates the system packages and runs Omarchy's own migrations.
update = "omarchy update"

[families.debian]
ids = ["debian", "ubuntu", "linuxmint", "pop", "elementary", "zorin", "raspbian", "kali", "devuan", "neon", "parrot", "mx", "deepin", "pureos", "tuxedo", "lmde", "trisquel", "peppermint", "bodhi", "ubuntu-core"]
detect = ["apt-get", "apt"]
install = "sudo apt install"
remove = "sudo apt remove"
search = "apt search"
update = "sudo apt update && sudo apt upgrade"
owns = "dpkg -S"
provides = "apt-file search bin/{}"
query = "dpkg -s"
list = "apt list --installed"
clean = "sudo apt autoremove && sudo apt clean"

[families.fedora]
ids = ["fedora", "rhel", "centos", "rocky", "almalinux", "ol", "amzn", "nobara", "bazzite", "scientific", "eurolinux", "centos-stream"]
detect = ["dnf", "yum"]
install = "sudo dnf install"
remove = "sudo dnf remove"
search = "dnf search"
update = "sudo dnf upgrade"
owns = "rpm -qf"
provides = "dnf provides '*/bin/{}'"
query = "rpm -q"
list = "dnf list --installed"
clean = "sudo dnf clean all"

[families.suse]
ids = ["opensuse", "opensuse-leap", "opensuse-tumbleweed", "opensuse-microos", "opensuse-slowroll", "suse", "sles", "sled", "sle-micro", "geckolinux"]
detect = ["zypper"]
install = "sudo zypper install"
remove = "sudo zypper remove"
search = "zypper search"
update = "sudo zypper update"
owns = "rpm -qf"
provides = "zypper search --provides {}"
query = "rpm -q"
list = "zypper search --installed-only"
clean = "sudo zypper clean --all"

[families.alpine]
ids = ["alpine", "postmarketos", "wolfi"]
detect = ["apk"]
install = "sudo apk add"
remove = "sudo apk del"
search = "apk search"
update = "sudo apk update && sudo apk upgrade"
owns = "apk info -W"
provides = "apk search -e cmd:{}"
query = "apk info -e"
list = "apk info"
clean = "sudo apk cache clean"

[families.void]
ids = ["void"]
detect = ["xbps-install"]
install = "sudo xbps-install -S"
remove = "sudo xbps-remove -R"
search = "xbps-query -Rs"
update = "sudo xbps-install -Su"
owns = "xbps-query -o"
provides = "xlocate {}"
query = "xbps-query"
list = "xbps-query -l"
clean = "sudo xbps-remove -O"

[families.gentoo]
ids = ["gentoo", "funtoo", "calculate", "pentoo", "redcore", "sabayon"]
detect = ["emerge"]
install = "sudo emerge --ask"
remove = "sudo emerge --ask --depclean"
search = "emerge --search"
update = "sudo emerge --sync && sudo emerge --ask --update --deep --newuse @world"
owns = "equery belongs"
provides = "e-file {}"
query = "equery list"
list = "equery list \"*\""
clean = "sudo eclean-dist"

# NixOS itself: the system is configured declaratively, so updating means rebuilding it.
[families.nixos]
ids = ["nixos"]
install = "nix profile install nixpkgs#{}"
remove = "nix profile remove {}"
search = "nix search nixpkgs {}"
update = "sudo nixos-rebuild switch --upgrade"
provides = "nix-locate bin/{}"
query = "nix-env -q"
list = "nix profile list"
clean = "sudo nix-collect-garbage"

# The Nix package manager on some other system (no NixOS in os-release, but `nix` on PATH, as
# in the nixos/nix container): there is no system to rebuild, only the user's profile to upgrade.
[families.nix]
extends = "nixos"
detect = ["nix", "nix-env"]
update = "nix profile upgrade --all"
