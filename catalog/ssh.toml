name = "ssh"
description = "Log in to another computer over the network"
template = "ssh {no_host_check} {port} {user}{host}"
keywords = ["remote login", "connect to server", "remote shell", "ssh into"]

[[flags]]
id = "no_host_check"
value = "-o StrictHostKeyChecking=no"
question = "Does the user say to skip, ignore or turn off the host key check?"
warning = "this skips the check of the server's identity: you cannot tell if someone is impersonating it."
risk = "weakens security"

[[slots]]
id = "host"
kind = "text"
what = "the computer to log in to"

[[slots]]
id = "user"
kind = "text"
what = "the user name to log in as"
default = ""
format = "{}@"

[[slots]]
id = "port"
kind = "text"
what = "the port the SSH server listens on"
default = ""
format = "-p {}"
