name = "git reset"
description = "Undo the last commit, or throw away all uncommitted changes"
template = "git reset {mode}"
kind = "action"
keywords = ["undo last commit", "undo the last commit but keep changes", "uncommit", "reset to last commit", "discard all local changes", "hard reset", "throw away all changes", "reset hard", "go back one commit"]

[[slots]]
id = "mode"
kind = "choice"
question = "What should happen to the changes?"

[[slots.options]]
name = "keep_changes"
value = "--soft HEAD~1"
description = "Undo the last commit but keep its changes staged"
warning = "this removes the last commit from the branch (rewrites history); its changes stay staged."

[[slots.options]]
name = "discard_all_changes"
value = "--hard"
description = "Throw away every uncommitted change and go back to the last commit"
warning = "all uncommitted changes in the repository are lost and cannot be recovered."

[[slots.options]]
name = "drop_last_commit"
value = "--hard HEAD~1"
description = "Remove the last commit and everything it changed"
warning = "the last commit and all uncommitted changes are lost (rewrites history)."
