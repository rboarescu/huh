name = "omarchy network speedtest"
description = "Measure how fast the internet connection is"
template = "omarchy network speedtest {direction}"
platform = "omarchy"
keywords = ["network speed", "wifi speed", "internet speed", "connection speed", "speedtest", "download speed", "upload speed", "bandwidth test"]

[[slots]]
id = "direction"
kind = "choice"
question = "Which direction of the connection does the user want measured?"

[[slots.options]]
name = "download"
value = "down"
description = "Download speed, or the user does not say"

[[slots.options]]
name = "upload"
value = "up"
description = "Upload speed"
