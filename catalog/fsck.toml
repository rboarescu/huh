name = "fsck"
description = "Check a disk partition's filesystem for errors; it only reads, nothing is changed"
template = "sudo fsck -n {device}"
kind = "query"
opposites = ["repair", "fix", "repairs"]
keywords = ["check filesystem", "filesystem check", "scan disk for errors", "check partition for errors", "fsck partition"]

[[slots]]
id = "device"
kind = "text"
what = "the partition to check"
extract = "device"
