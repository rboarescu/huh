name = "journalctl"
description = "Read the system log, or the log of one background service"
template = "journalctl {boot} {follow} {priority} {unit} {since} {lines}"
keywords = ["service logs", "systemd logs", "system log", "journal", "follow logs", "boot logs", "last log lines", "daemon logs"]

[[flags]]
id = "boot"
value = "-b"
question = "Does the user only want messages since the computer was last started?"

[[flags]]
id = "follow"
value = "-f"
question = "Does the user want to keep watching for new messages as they appear?"

[[slots]]
id = "priority"
kind = "text"
what = "only messages of this severity or worse (err, warning, crit)"
default = ""
format = "-p {}"
extract = "log_priority"

[[slots]]
id = "unit"
kind = "text"
type = "service"
what = "the service whose log to read"
default = ""
format = "-u {}"

[[slots]]
id = "lines"
kind = "text"
what = "the number of most recent log lines to show"
format = "-n {} --no-pager"
default = ""

[[slots]]
id = "since"
kind = "text"
what = "how far back to read (for example 1 hour ago, yesterday)"
default = ""
format = "--since {}"
