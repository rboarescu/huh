name = "systemctl --user"
description = "Start, stop, restart or check one of my own user services, the ones that run without root"
template = "systemctl --user {action} {service}"
keywords = ["user service", "start user service", "restart user service", "user daemon", "systemd user unit", "autostart at login"]

[[slots]]
id = "action"
kind = "choice"
question = "What does the user want to do with the service?"

[[slots.options]]
name = "start"
value = "start"
description = "Start a service that is not running"

[[slots.options]]
name = "stop"
value = "stop"
description = "Stop a running service"

[[slots.options]]
name = "restart"
value = "restart"
description = "Stop the service and start it again"

[[slots.options]]
name = "status"
value = "status"
description = "See whether the service is running and whether it reported errors"

[[slots.options]]
name = "enable"
value = "enable"
description = "Make the service start by itself at every login"

[[slots.options]]
name = "disable"
value = "disable"
description = "Stop the service from starting by itself"

[[slots]]
id = "service"
kind = "text"
what = "the service"
