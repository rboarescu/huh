name = "git push"
description = "Upload my git commits to the remote server"
template = "git push {upstream} {force} {no_verify} {remote} {branch}"
keywords = ["upload commits", "push to origin", "push branch", "send commits", "push this branch to origin", "publish a branch", "push for the first time", "set upstream", "force push"]

[[flags]]
id = "upstream"
value = "-u origin HEAD"
question = "Does the user want to push a branch to origin for the first time and track it?"

[[flags]]
id = "force"
value = "--force-with-lease"
question = "Does the user want to force the push, overwriting what is on the remote?"
warning = "the remote history is overwritten; --force-with-lease refuses if someone else pushed meanwhile, but commits on the remote that you do not have are still lost."
risk = "rewrites history"

[[flags]]
id = "no_verify"
value = "--no-verify"
question = "Does the user say to bypass the hooks?"
warning = "this skips the pre-push hooks, the checks (tests, lint, secret scans) the project set up to run first."
risk = "weakens security"

[[slots]]
id = "remote"
kind = "text"
what = "the remote to push to, usually origin"
default = ""
extract = "sys_push_remote"

[[slots]]
id = "branch"
kind = "text"
what = "the branch to push"
default = ""
extract = "sys_push_branch"
warning = "this sends your commits to a branch other people and automatic deploys usually rely on; a branch plus a pull request is the usual route."
risk = "affects other people or production"
warn_when = ["main", "master", "trunk", "develop", "production", "prod", "stable"]
