name = "docker exec"
description = "Open a shell inside a Docker container that is already running"
template = "docker exec -it {user} {container} sh"
kind = "action"
keywords = ["shell inside container", "bash in container", "enter running container", "run command in container"]

[[slots]]
id = "container"
kind = "text"
type = "container"
what = "the container to get into"

[[slots]]
id = "user"
kind = "text"
type = "user"
what = "the user to run as inside the container (root, postgres)"
default = ""
format = "-u {}"
