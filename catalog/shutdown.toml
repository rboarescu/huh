name = "shutdown"
description = "Turn the computer off now or at a set time"
template = "sudo shutdown -h {when}"
destructive = true
warning = "this powers the computer off: all programs are closed and unsaved work is lost."
keywords = ["power off", "turn off computer", "shut down pc", "halt system", "power down", "shutdown now", "shut down in minutes", "schedule a shutdown", "power off at a set time"]

[[slots]]
id = "when"
kind = "text"
what = "when to power off: now, +MINUTES or HH:MM"
default = "now"
extract = "shutdown_time"
