name = "find chmod dirs"
description = "Set the permissions of every folder below a folder, leaving the files alone"
template = "find {where} -type d -exec chmod {mode} {} +"
kind = "action"
destructive = true
warning = "this changes the permissions of every folder below the folder; on a system folder that can break the system."
keywords = ["chmod all directories in", "chmod all folders in", "permissions of all folders", "755 on all directories", "set mode on folders only", "directory permissions recursively"]

[[slots]]
id = "where"
kind = "path"
what = "the folder whose folders should change"
default = "."

[[slots]]
id = "mode"
kind = "text"
what = "the permission mode, such as 755"
extract = "chmod_mode"
