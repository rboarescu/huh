name = "rsync"
description = "Make one folder match another, copying only the files that changed"
template = "rsync -av {delete} {exclude} {source} {dest}"
keywords = ["sync folders", "mirror folder", "incremental copy", "backup folder", "copy changed files"]

[[flags]]
id = "delete"
value = "--delete"
question = "Does the user want files deleted from the destination when they no longer exist in the source (an exact mirror)?"
warning = "files in the destination that are not in the source are deleted; check the destination path first (--dry-run shows what would happen)."
risk = "destroys data"

[[slots]]
id = "source"
kind = "path"
what = "the folder to copy from"

[[slots]]
id = "dest"
kind = "path"
what = "the destination that receives the files"

[[slots]]
id = "exclude"
kind = "text"
what = "a name or pattern to leave out"
default = ""
format = "--exclude={}"
