name = "git switch"
description = "Switch to another git branch, or create a new one"
template = "git switch {create} {branch}"
keywords = ["change branch", "checkout branch", "new branch", "create branch", "switch git branch", "switch to main", "switch to a branch", "go to branch", "checkout main", "git checkout"]

[[flags]]
id = "create"
value = "-c"
question = "Does the user want a new branch created?"

[[slots]]
id = "branch"
kind = "text"
what = "the branch"
