name = "systemctl"
description = "Start, stop, restart or check a background service"
template = "sudo systemctl {action} {service}"
keywords = ["start service", "stop service", "restart service", "restart nginx", "restart sshd", "restart a daemon", "enable at boot", "disable at boot", "systemd daemon", "background service"]

[[slots]]
id = "action"
kind = "choice"
question = "What does the user want to do with the service?"

[[slots.options]]
name = "start"
value = "start"
description = "Start a service that is not running"

[[slots.options]]
name = "stop"
value = "stop"
description = "Stop a running service"
warning = "this stops the service: whatever depends on it stops working until it is started again."

[[slots.options]]
name = "restart"
value = "restart"
description = "Stop the service and start it again"
warning = "this restarts the service: connections to it are dropped for a moment."

[[slots.options]]
name = "enable"
value = "enable"
description = "Make the service start by itself every time the computer boots"

[[slots.options]]
name = "disable"
value = "disable"
description = "Stop the service from starting by itself at boot"
warning = "this stops the service from starting at boot, which can break whatever depends on it."

[[slots]]
id = "service"
kind = "text"
what = "the service"
