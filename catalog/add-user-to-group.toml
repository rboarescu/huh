name = "add user to group"
description = "Add my user to a group, for example to use docker without sudo"
template = "sudo usermod -aG {group} {user}"
destructive = true
warning = "this gives the user every right of that group; docker, wheel and sudo are root-equivalent. The user must log out and in again for it to apply."
risk = "gives away access"
kind = "action"
opposites = ["who is in", "members of", "who belongs"]
keywords = ["join group", "usermod", "docker group", "group permissions", "add myself to group", "without sudo"]

[[slots]]
id = "group"
kind = "text"
type = "group"
what = "the group to join"

[[slots]]
id = "user"
kind = "text"
type = "user"
what = "the user to add (you, when the request names nobody)"
default = "$USER"
