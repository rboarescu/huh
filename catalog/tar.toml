name = "tar"
description = "Pack files into a .tar.gz archive, unpack one, or look inside one"
template = "tar {action} {archive} {exclude} {outdir} {inputs} {member}"
kind = "mixed"
keywords = ["tarball", "tar.gz", "unpack archive", "extract tar", "extract tar.gz", "pack folder", "create tar.gz", "compress folder", "list archive contents", "inspect tar", "whats inside tar"]

[[slots]]
id = "action"
kind = "choice"
question = "What does the user want to do with the archive?"

[[slots.options]]
name = "create"
value = "-czf"
description = "Pack files or folders into a new archive"

[[slots.options]]
name = "extract"
value = "-xzf"
description = "Unpack an existing archive"

[[slots.options]]
name = "list_contents"
value = "-tzf"
read_only = true
description = "See what an archive contains without unpacking it"

[[slots]]
id = "archive"
kind = "path"
what = "the archive file"

[[slots]]
id = "inputs"
kind = "path"
what = "the file or folder to put into a new archive"
default = ""

[[slots]]
id = "exclude"
kind = "text"
what = "a name or pattern to leave out of the new archive"
default = ""
format = "--exclude={}"

[[slots]]
id = "outdir"
kind = "path"
what = "the folder to unpack into"
default = ""
format = "-C {}"

[[slots]]
id = "member"
kind = "path"
what = "the one file inside the archive to unpack"
default = ""
