id = "media-and-everyday"
number = 10
title = "Media & Everyday Files"
summary = "Open files in desktop apps, send clutter to the Trash safely, play music and video with mpv and vlc, and trim or convert clips with ffmpeg."
badge = "media_wrangler"
unlocks_species = "dolphin"
unlock_after = "finding-your-way"

[[lessons]]
id = "u10-open-and-trash"
title = "Open, Inspect & Trash Safely"
intro = "Bridge the terminal and your desktop: open any file or folder with xdg-open, check mystery files with file, and trash safely with gio trash."

[[lessons.questions]]
kind = "explain_choice"
id = "u10-l1-q1"
command = "xdg-open photo.png"
prompt = "You are browsing files in your terminal and want to look at `photo.png` in your regular picture viewer. What does `xdg-open photo.png` do?"
choices = [
    "Prints raw pixel bytes across your terminal",
    "Opens `photo.png` in your desktop's default image viewer app",
    "Deletes `photo.png` after 5 seconds",
    "Renames `photo.png` to `photo.jpg`",
]
answer = 1
hint = "`xdg-open` works like double-clicking a file in your graphical file manager."
note = "`xdg-open` works for pictures, PDFs, web links, and even folders — it picks whatever desktop app handles that kind of file."

[[lessons.questions]]
kind = "type_command"
id = "u10-l1-q2"
prompt = "Open your current folder (`.`) in your graphical file manager using `xdg-open`."
accepted = ["xdg-open .", "xdg-open ./"]
hints = [
    "Pass `.` (the current folder shortcut) to `xdg-open`.",
    "Type `xdg-open .`.",
]
note = "Whenever you want to drag and drop files from the folder you are working in, `xdg-open .` pops open your file manager right there!"

[[lessons.questions]]
kind = "read_output"
id = "u10-l1-q3"
command = "file mystery.bin"
output = "mystery.bin: PNG image data, 800 x 600, 8-bit/color RGBA, non-interlaced"
prompt = "A download arrived named `mystery.bin`, so you inspected it with `file mystery.bin`. What kind of file is it really?"
choices = [
    "A plain text grocery list",
    "A compressed `.tar.gz` archive",
    "An 800x600 PNG picture — you can rename it to `.png` and open it with `xdg-open`",
    "A runnable Linux game",
]
answer = 2
hint = "Linux ignores filename extensions when `file` reads the actual file header bytes."
note = "`file` peeks at the magic header inside any file, so wrong extensions like `.bin` or `.tmp` cannot fool you."

[[lessons.questions]]
kind = "type_command"
id = "u10-l1-q4"
prompt = "Move `old-clip.mp4` into your desktop Trash bin (so you can restore it later if needed) using `gio trash`."
accepted = ["gio trash old-clip.mp4", "gio trash ./old-clip.mp4"]
hints = [
    "Use `gio trash` followed by the filename.",
    "Type `gio trash old-clip.mp4`.",
]
note = "Unlike `rm`, `gio trash` puts files in your desktop Trash bin so you have a safety net if you change your mind."

[[lessons.questions]]
kind = "spot_danger"
id = "u10-l1-q5"
prompt = "You want to tidy your songs without risking your whole music collection. Which command is DANGEROUS because it erases `~/Music` permanently with no Trash bin?"
choices = [
    "ls -lh ~/Music",
    "xdg-open ~/Music",
    "rm -rf ~/Music",
    "gio trash ~/Music/scratch.mp3",
]
answer = 2
risk = "destroys data"
hint = "Look for `rm -rf`, which wipes entire folders without any Trash or confirmation."
note = "Prefer `gio trash` for everyday cleanup! Save `rm` only for temporary files you are 100% sure you never want back."

[[lessons]]
id = "u10-playing-media"
title = "Playing Video & Music"
intro = "Play videos and songs straight from the command line with mpv and vlc, loop study music, and check which media folders eat disk space."

[[lessons.questions]]
kind = "explain_choice"
id = "u10-l2-q1"
command = "mpv movie.mp4"
prompt = "What does `mpv movie.mp4` do?"
choices = [
    "Plays `movie.mp4` in the fast, keyboard-friendly `mpv` media player",
    "Converts `movie.mp4` into an `.mp3` song",
    "Deletes `movie.mp4` from disk",
    "Checks `movie.mp4` for syntax errors",
]
answer = 0
hint = "`mpv` is a clean media player you launch right from the terminal."
note = "Inside `mpv`, press Space to pause, left/right arrows to jump, `f` for full-screen, and `q` to quit."

[[lessons.questions]]
kind = "type_command"
id = "u10-l2-q2"
prompt = "Listen to `podcast.mp3` with `mpv` without opening a video window, using `--no-video`."
accepted = [
    "mpv --no-video podcast.mp3",
    "mpv podcast.mp3 --no-video",
    "mpv --no-video ./podcast.mp3",
    "mpv ./podcast.mp3 --no-video",
]
hints = [
    "Pass `--no-video` to `mpv` along with `podcast.mp3`.",
    "Type `mpv --no-video podcast.mp3`.",
]
note = "`mpv --no-video` plays audio cleanly right inside your terminal without popping up an extra window."

[[lessons.questions]]
kind = "explain_choice"
id = "u10-l2-q3"
command = "mpv --loop-file=inf lofi.mp3"
prompt = "You put on chill music while coding. What does `--loop-file=inf` tell `mpv` to do with `lofi.mp3`?"
choices = [
    "Repeat `lofi.mp3` over and over forever until you stop it",
    "Play only the first 5 seconds",
    "Play the song backwards",
    "Save 100 copies of `lofi.mp3` into your folder",
]
answer = 0
hint = "`inf` is short for \"infinity\"."
note = "`--loop-file=inf` works great for ambient rain sounds, study beats, or short looping animations."

[[lessons.questions]]
kind = "type_command"
id = "u10-l2-q4"
prompt = "Open and play `clip.mkv` using `vlc` from the terminal."
accepted = ["vlc clip.mkv", "vlc ./clip.mkv"]
hints = [
    "Run `vlc` followed by `clip.mkv`.",
    "Type `vlc clip.mkv`.",
]
note = "Both `mpv` and `vlc` play almost every video and audio format out there (`.mp4`, `.mkv`, `.webm`, `.mp3`, `.flac`)."

[[lessons.questions]]
kind = "read_output"
id = "u10-l2-q5"
command = "du -sh ~/Videos/*"
output = "4.2G\t/home/sam/Videos/movies\n850M\t/home/sam/Videos/clips\n"
prompt = "Your drive is filling up, so you checked folder sizes with `du -sh ~/Videos/*`. Which subfolder takes up more disk space?"
choices = [
    "`/home/sam/Videos/clips` (`850M`)",
    "`/home/sam/Videos/movies` (`4.2G`)",
    "They are the same size",
]
answer = 1
hint = "`G` stands for gigabytes (about 1,000 megabytes), while `M` is megabytes."
note = "`du -sh` makes it easy to spot huge video folders before your disk runs out of room."
expect_output_match = true

[[lessons]]
id = "u10-ffmpeg-basics"
title = "Everyday Media Tools (`ffmpeg`)"
intro = "Use ffmpeg to pull audio out of a video, trim a highlight clip, shrink giant video files, and inspect sizes safely."

[[lessons.questions]]
kind = "explain_choice"
id = "u10-l3-q1"
command = "ffmpeg -i clip.mp4 -vn song.mp3"
prompt = "You recorded a music clip (`clip.mp4`) and want just the sound as an MP3. What does `-vn` do in `ffmpeg -i clip.mp4 -vn song.mp3`?"
choices = [
    "Drops the video track (`video no`) and saves only the audio into `song.mp3`",
    "Doubles the video resolution",
    "Deletes `clip.mp4` when finished",
    "Turns the brightness up",
]
answer = 0
hint = "`-vn` literally stands for \"video: no\" — skip the video stream."
note = "`ffmpeg` always reads from `-i <input>` and writes a brand-new output file at the end without harming your original `clip.mp4`."

[[lessons.questions]]
kind = "explain_choice"
id = "u10-l3-q2"
command = "ffmpeg -i movie.mp4 -ss 00:01:00 -t 30 cut.mp4"
prompt = "What does `ffmpeg -i movie.mp4 -ss 00:01:00 -t 30 cut.mp4` produce?"
choices = [
    "A 30-second clip (`-t 30`) starting 1 minute into `movie.mp4` (`-ss 00:01:00`), saved as `cut.mp4`",
    "30 separate PNG screenshots",
    "Replaces `movie.mp4` with 1 minute of black screen",
    "Speeds `movie.mp4` up by 30x",
]
answer = 0
hint = "`-ss` is the start timestamp (`00:01:00`) and `-t` is the clip duration in seconds (`30`)."
note = "Trimming a quick 30-second clip with `-ss` and `-t` is way faster than opening a heavy video editor just to share a short highlight!"

[[lessons.questions]]
kind = "type_command"
id = "u10-l3-q3"
prompt = "Compress `big.mp4` into a smaller `small.mp4` using `ffmpeg` with `-crf 28` (higher CRF shrinks file size)."
accepted = [
    "ffmpeg -i big.mp4 -crf 28 small.mp4",
    "ffmpeg -i big.mp4 -crf=28 small.mp4",
    "ffmpeg -crf 28 -i big.mp4 small.mp4",
]
hints = [
    "Pass `-i big.mp4`, then `-crf 28`, then the new output filename `small.mp4`.",
    "Type `ffmpeg -i big.mp4 -crf 28 small.mp4`.",
]
note = "For sharing videos in chat, `-crf 24` to `28` usually shrinks files dramatically while keeping them clear to watch."

[[lessons.questions]]
kind = "read_output"
id = "u10-l3-q4"
command = "ls -lh"
output = """
total 44M
-rw-r--r-- 1 sam sam  40M Nov 20 14:10 clip.mp4
-rw-r--r-- 1 sam sam 3.2M Nov 20 14:11 song.mp3
"""
prompt = "Look at this `ls -lh` output after extracting audio from `clip.mp4`. How do the two file sizes compare?"
choices = [
    "`song.mp3` is bigger than `clip.mp4`",
    "`song.mp3` is only `3.2M` compared to `40M` for `clip.mp4` — dropping video saves most of the space",
    "Both files are `44M`",
]
answer = 1
hint = "Compare the size column right before `Nov 20` on each file's row."
note = "`ls -lh` adds `-h` (human-readable) to `ls -l`, making it super easy to verify how much space your trimmed or converted files save."
expect_output_match = true

[[lessons.questions]]
kind = "spot_danger"
id = "u10-l3-q5"
prompt = "Someone tells you \"just run `chmod -R 777 ~/Videos` if a player complains about permissions.\" Why does `huh` warn against `chmod -R 777 ~/Videos`?"
command = "chmod -R 777 ~/Videos"
choices = [
    "It deletes every movie inside `~/Videos`",
    "It makes every file and subfolder under `~/Videos` writable by every user and program on the machine — `644` for files or `755` for folders is much safer",
    "It re-encodes every video at low quality",
    "It uploads `~/Videos` to the internet",
]
answer = 1
risk = "gives away access"
hint = "The third `7` in `777` gives write and execute rights to everyone else on the system, and `-R` changes the whole folder tree."
note = "Never blindly run `chmod -R 777`! Keep videos `644` (readable by you, not world-writable) and folders `755`."

[practice]
id = "u10-downloads-cleanup"
title = "Downloads Cleanup"
goal = "Sort the messy `inbox/` folder into three new folders — `videos/`, `music/`, and `pictures/` (`trailer.mp4` -> `videos/`, `song.mp3` -> `music/`, `poster.png` -> `pictures/`) — and delete `inbox/broken.tmp`."
hints = [
    "Create all three destination folders first: `mkdir videos music pictures`.",
    "Move each file (`mv inbox/trailer.mp4 videos/`, `mv inbox/song.mp3 music/`, `mv inbox/poster.png pictures/`) and clean up `rm inbox/broken.tmp`.",
]

[practice.setup]
dirs = ["inbox"]
files = [
    { path = "inbox/trailer.mp4", content = "sample-video-bytes\n" },
    { path = "inbox/song.mp3", content = "sample-audio-bytes\n" },
    { path = "inbox/poster.png", content = "sample-image-bytes\n" },
    { path = "inbox/broken.tmp", content = "incomplete download\n" },
]

[[practice.checks]]
kind = "dir_exists"
path = "videos"
label = "Folder `videos` exists"

[[practice.checks]]
kind = "dir_exists"
path = "music"
label = "Folder `music` exists"

[[practice.checks]]
kind = "dir_exists"
path = "pictures"
label = "Folder `pictures` exists"

[[practice.checks]]
kind = "file_exists"
path = "videos/trailer.mp4"
label = "`videos/trailer.mp4` sorted into `videos/`"

[[practice.checks]]
kind = "file_exists"
path = "music/song.mp3"
label = "`music/song.mp3` sorted into `music/`"

[[practice.checks]]
kind = "file_exists"
path = "pictures/poster.png"
label = "`pictures/poster.png` sorted into `pictures/`"

[[practice.checks]]
kind = "not_exists"
path = "inbox/broken.tmp"
label = "`inbox/broken.tmp` has been deleted"
