# --- 9. False alarms: words in a sentence are not an error -------------------------------------

[[case]]
command = "node -e 'console.log(\"Error handling docs: no failure here\")'"
exit = 0
output = "Error handling docs: no failure here"
mention = ["succeeded"]
forbid = ["failed with an error", "failed with"]
fix = "nothing"

[[case]]
command = ""
output = "Error handling docs: no failure here"
mention = ["error"]
forbid = ["failed with an error", "failed with"]
fix = "nothing"

[[case]]
command = ""
