# Failures from the second measurement round (186 real failures, fresh cases). Same format as
# errors-real.toml. Outputs were produced in Debian 12 containers (as a normal user), except where
# a container cannot produce them (pacman, docker daemon, ssh host keys, missing dev libraries,
# out-of-memory kills), which are pasted text. Guiding rule: a confident wrong cause or fix is
# worse than saying huh does not recognise the output.

# --- 1. Permission denied: which operation was it? --------------------------------------------

[[case]]
command = "echo x > /etc/foo"
exit = 1
output = "bash: /etc/foo: Permission denied"
mention = ["/etc/foo", "write|written|create", "administrator|root"]
forbid = ["chmod +x", "not executable", "sudo echo"]
fix = "sudo tee /etc/foo"

[[case]]
command = "echo x >> /etc/foo"
exit = 1
output = "bash: line 1: /etc/foo: Permission denied"
mention = ["/etc/foo", "write|written|create", "administrator|root"]
forbid = ["chmod +x", "not executable"]
fix = "sudo tee -a /etc/foo"

[[case]]
command = "echo x | tee /etc/foo"
exit = 1
output = "tee: /etc/foo: Permission denied\nx"
mention = ["/etc/foo", "write|written|create"]
forbid = ["chmod +x", "not executable", "sudo echo"]
fix = "sudo tee /etc/foo"

[[case]]
command = ""
output = "bash: /etc/foo: Permission denied"
mention = ["/etc/foo", "written or run|written|run", "administrator|root"]
forbid = ["chmod +x", "found but is not executable"]
fix = "nothing"

# --- 2. pacman as a user: keep the user's operation --------------------------------------------

[[case]]
command = "pacman -Syu"
exit = 1
output = "error: you cannot perform this operation unless you are root."
mention = ["sudo", "root"]
forbid = ["pacman -S <package>", "<package>"]
fix = "sudo pacman -Syu"

[[case]]
command = "pacman -R bash"
exit = 1
output = "error: you cannot perform this operation unless you are root."
mention = ["sudo", "root"]
forbid = ["pacman -S <package>", "<package>"]
fix = "sudo pacman -R bash"

[[case]]
command = ""
output = "error: you cannot perform this operation unless you are root."
mention = ["same pacman command with sudo", "root"]
forbid = ["pacman -S <package>", "<package>", "<"]
fix = "nothing"

