# Sysadmin round: requests that fresh testers got wrong (missing entries, wrong-but-confident rankings) plus
# variants. Value-binding cases (pkill names, "is docker running" filling a service, placeholders for named
# values) live in slots*.toml, not here.

# git

[[case]]
request = "cherry-pick commit abc1234"
command = "git cherry-pick"
expect = 'git cherry-pick abc1234'

[[case]]
request = "cherry pick a1b2c3d onto this branch"
command = "git cherry-pick"
expect = 'git cherry-pick a1b2c3d'

[[case]]
request = "apply commit 9f8e7d6 to my branch"
command = "git cherry-pick"
expect = 'git cherry-pick 9f8e7d6'

[[case]]
request = "show diff between main and develop"
command = "git diff"
expect = 'git diff main develop'

[[case]]
request = "compare branches main and release"
command = "git diff"
expect = 'git diff main release'

[[case]]
request = "what changed between v1.0 and v2.0"
command = "git diff"
expect = 'git diff v1.0 v2.0'

[[case]]
request = "squash the last 3 commits"
command = "git rebase"
expect = 'git rebase -i HEAD~3'
