[[case]]
request = "squash last 5 commits into one"
command = "git rebase"
expect = 'git rebase -i HEAD~5'
warn = true

[[case]]
request = "combine the last 2 commits"
command = "git rebase"
expect = 'git rebase -i HEAD~2'
