expect = 'git stash push -m wip-auth'

[[case]]
request = "stash my work with the message wip-login"
command = "git stash push"
expect = 'git stash push -m wip-login'

[[case]]
request = "stash my changes"
command = "git stash"
expect = 'git stash'

[[case]]
request = "create a branch called feature/login-fix from main"
command = "git switch"
expect = 'git switch -c feature/login-fix main'

[[case]]
request = "create new branch hotfix-12"
command = "git switch"
expect = 'git switch -c hotfix-12'

[[case]]
request = "make a new branch named dev-ui from develop"
command = "git switch"
expect = 'git switch -c dev-ui develop'

[[case]]
request = "force push to origin main"
command = "git push"
expect = 'git push --force-with-lease origin main'
