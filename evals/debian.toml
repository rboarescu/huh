# Run with: huh eval --cases evals/debian.toml --platform debian
# Checks that package requests map to apt when the system is Debian-like.

[[case]]
request = "install vlc"
command = "apt install"
expect = "sudo apt install vlc"

[[case]]
request = "uninstall libreoffice"
command = "apt remove"
expect = "sudo apt remove libreoffice"

[[case]]
request = "update all my packages"
command = "apt update"
expect = "sudo apt update && sudo apt upgrade"

[[case]]
request = "is there a package for gimp"
command = "apt search"
expect = "apt search gimp"

[[case]]
request = "switch the desktop theme to Everforest"
command = "none"
