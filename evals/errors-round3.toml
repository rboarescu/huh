# Round 3: failures from 244 real runs by fresh testers. Outputs were produced in Debian 12 / Arch
# containers (as a normal user, core dumps disabled), except where a container cannot produce them
# (systemd not booted, sshd key checks, Go, jest, GitHub, terraform, kubectl, a held dpkg lock,
# a core dump), which are pasted text. Guiding rule: a confident wrong cause or fix is worse than
# saying huh does not recognise the output.

[[case]]
command = "echo test >> /etc/hosts"
exit = 1
output = "bash: line 1: /etc/hosts: Permission denied"
mention = ["/etc/hosts", "append", "administrator|root"]
fix = "echo test | sudo tee -a /etc/hosts"
forbid = ["sudo tee /etc/hosts", "written or run"]

