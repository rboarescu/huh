# Real outputs captured on an Arch laptop or in the huh repository (names, addresses and MACs
# replaced; ping and the second git status are typed from the standard format). expect = the
# entry that must be recognised and fields = keys it must explain; expect = "none" outputs must
# NOT be recognised. Run by cargo test (src/outputs.rs).

