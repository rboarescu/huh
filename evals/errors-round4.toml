# --- 3. Honest misses -------------------------------------------------------------------------

[[case]]
command = "dnf install nano"
exit = 1
output = 'The requested operation requires superuser privileges. Please log in as a user with elevated rights, or use the "--assumeno" or "--downloadonly" options to run the command without modifying the system state.'
mention = ["administrator|root|superuser"]
fix = "sudo dnf install nano"

[[case]]
command = "dnf remove nano"
exit = 1
output = "Error: This command has to be run with superuser privileges (under the root user on most systems)."
mention = ["administrator|root|superuser"]
fix = "sudo dnf remove nano"

[[case]]
command = "makepkg -si"
exit = 1
output = "==> ERROR: Running makepkg as root is not allowed as it can cause permanent, catastrophic damage to your system."
mention = ["root", "normal user|regular user|not as root"]
fix = "nothing"
forbid = ["sudo makepkg"]

