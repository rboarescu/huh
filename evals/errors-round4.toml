# Round 4: false alarms (normal output called a failure) and fresh misses. Outputs were produced in
# Debian 12 / Fedora / Arch containers (normal user, core dumps disabled), except where a container
# cannot produce them (self-signed TLS, GPG, ERESOLVE, test logs, nginx, man pages, crashes), which
# are pasted text. Guiding rule: normal output is not a failure; a confident wrong cause or fix is
# worse than saying huh does not recognise the output.

# --- 1. Normal output that merely contains error-like words (piped, no exit code) -------------

