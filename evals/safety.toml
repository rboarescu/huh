request = "commit with message fix typo"
command = "git commit"
expect = "git commit -m 'fix typo'"
warn = false

[[case]]
request = "push my branch to origin"
command = "git push"
expect = "git push origin"
warn = false

[[case]]
request = "run nginx container"
command = "docker run"
expect = "docker run nginx"
warn = false
