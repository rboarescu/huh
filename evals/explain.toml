# Eval cases for `huh explain`, run by the `explain_evals` test (cargo test).
# line      = the command line given to `huh explain`
# expect    = substrings that must appear in the rendered explanation
# absent    = substrings that must NOT appear in the rendered explanation
# warn      = substrings that must appear in the WARNINGS (the part named or the text)
# no_warn   = substrings that must NOT appear in the WARNINGS
# needs_man = skip the case when this man page is not installed on the machine

[[case]]
line = "find . -name '*.log' -mtime +7 -delete"
expect = ["more than 7 days ago", "DELETE every match", "pattern *.log"]
absent = ["days back"]
warn = ["-delete"]

[[case]]
line = "find . -name '*.log' -mtime +7 -print0 | xargs -0 rm -f"
expect = ["NUL byte", "for the items read from standard input", "Never ask"]
warn = ["xargs", "rm"]

[[case]]
