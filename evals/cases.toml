expect = "sudo pacman -U howdy.pkg.tar.zst"

[[case]]
request = "unpack game.rar"
command = "unrar"
expect = "unrar x game.rar"

[[case]]
request = "unload gemma3 from memory"
command = "ollama stop"
expect = "ollama stop gemma3"

[[case]]
request = "how fast does qwen3 run, show tokens per second"
command = "ollama run"
expect = "ollama run qwen3 --verbose"

[[case]]
request = "start the ollama server"
command = "ollama serve"
expect = "ollama serve"

[[case]]
request = "which network cards does the vm devbox have"
command = "virsh domiflist"
expect = "virsh domiflist devbox"

[[case]]
request = "show the last 50 log lines of the sshd service"
command = "journalctl"
expect = "journalctl -u sshd -n 50 --no-pager"

[[case]]
request = "search the ssh logs for failed"
command = "search service log"
expect = "journalctl -u ssh | grep -i failed"

[[case]]
request = "what's taking up the most space in this folder"
command = "largest items|du"
expect = "du -sh * | sort -h"

[[case]]
request = "is my disk /dev/nvme0n1 healthy"
command = "smartctl"
expect = "sudo smartctl -a /dev/nvme0n1"

[[case]]
request = "read the qr code in ticket.png"
command = "zbarimg"
expect = "zbarimg ticket.png"

[[case]]
request = "count how often each line occurs in votes.txt, most common first"
command = "uniq"
expect = "sort votes.txt | uniq -c | sort -nr"

[[case]]
request = "show only column 2 of data.csv"
command = "cut"
expect = "cut -d, -f2 data.csv"

