# Never-mislead evals: a wrong answer is worse than "No suggestion". Questions about state get queries or
# nothing (never an action); destructive entries need the verb and the object named; invented values are
# placeholders; overwrites carry a WARNING. command = expected entry name(s) "a|b" or "none".

