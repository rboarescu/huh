# Intent evals: a question about state must not get an action, an instruction must not get a
# bare query, opposites must not be mixed up, and requests that only share a stray word with
# the catalog get nothing. Scored on an Omarchy system like cases.toml.

# ---- package queries ----
[[case]]
request = "is vlc installed"
command = "package installed"
expect = "pacman -Q vlc"

[[case]]
request = "do i have firefox installed"
command = "package installed"
expect = "pacman -Q firefox"

[[case]]
request = "check if htop is installed"
command = "package installed"
expect = "pacman -Q htop"

[[case]]
request = "list installed packages"
command = "package list"
expect = "pacman -Q"

[[case]]
request = "what packages do i have installed"
command = "package list"
expect = "pacman -Q"

[[case]]
request = "can you show me all the installed packages"
command = "package list"
expect = "pacman -Q"

[[case]]
request = "install vlc"
command = "package install"
expect = "omarchy pkg add vlc"

[[case]]
request = "can you install vlc for me"
command = "package install"
expect = "omarchy pkg add vlc"

[[case]]
request = "clean up old packages"
command = "package cache clean"
expect = "sudo pacman -Sc"
warn = true

[[case]]
request = "clear the package cache"
command = "package cache clean"
expect = "sudo pacman -Sc"
warn = true

