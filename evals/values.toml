# Typed values must never vanish silently: every value the request types (a path, number, address,
# name, hash, quoted text, ...) must show up in the first suggestion's line or in one of its notes
# ("not included: ..."). `values` lists what must appear (case-insensitive; "a|b" accepts either
# spelling); command = "any" accepts whatever command comes first, since the guarantee is about the
# values, not the command. Lines with several lost values also get a lower confidence.

# --- the examples that fresh testers hit -----------------------------------------------------------

[[case]]
request = "df human readable for /var"
command = "df"
expect = "df -h /var"
values = ["/var"]

[[case]]
request = "git clone https://github.com/acme/api.git into /opt/api depth 1"
command = "git clone"
expect = "git clone --depth 1 https://github.com/acme/api.git /opt/api"
values = ["https://github.com/acme/api.git", "/opt/api", "depth 1|--depth 1"]

[[case]]
request = "docker stats for container redis"
command = "docker stats"
expect = "docker stats redis"
values = ["redis"]

[[case]]
request = "generate ed25519 ssh key with comment ops@lab"
command = "ssh-keygen"
expect = "ssh-keygen -t ed25519 -C ops@lab"
values = ["ops@lab"]

[[case]]
request = "docker prune unused images older than 24h"
command = "docker image prune"
values = ["24h"]

[[case]]
request = "count lines in all .rs files under src"
command = "any"
expect = "find src -type f -name '*.rs' | xargs wc -l"
values = ["src", ".rs"]

[[case]]
request = "git cherry-pick abc1234 onto release"
command = "git cherry-pick"
values = ["abc1234", "release"]

[[case]]
request = "docker run nginx on port 8080:80 detached name web"
command = "docker run"
expect = "docker run -d -p 8080:80 --name web nginx"
values = ["8080:80", "web", "nginx"]

