# Slot filling: values must land in the right slot, or stay a <placeholder>; a wrong value is worse than a placeholder.
# Folder entries ending in / are folders. `note` = text the notes under the line must contain.


# 1. exact names beat prefixes; 'folder' wants a folder

[[case]]
request = "how do i delete the projects folder"
command = "rm"
expect = "rm -r projects"
files = ["notes.txt", "My Resume.pdf", "beach.png", "backup.sh", "report.docx", "big_video.mp4", "projects/", "projects-download.zip", "old_stuff.tar.gz", "Vacation Photos/"]

[[case]]
request = "go to the projects folder"
command = "cd"
expect = "cd projects"
files = ["notes.txt", "My Resume.pdf", "beach.png", "backup.sh", "report.docx", "big_video.mp4", "projects/", "projects-download.zip", "old_stuff.tar.gz", "Vacation Photos/"]

