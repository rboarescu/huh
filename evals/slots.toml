# 5. stated modifiers land in a slot

[[case]]
request = "ssh to web1 as deploy"
command = "ssh"
expect = "ssh deploy@web1"

[[case]]
request = "ssh to web1 on port 2222"
command = "ssh"
expect = "ssh -p 2222 web1"

[[case]]
request = "ssh into build-server as ci on port 2200"
command = "ssh"
expect = "ssh -p 2200 ci@build-server"

[[case]]
request = "ssh to web1"
command = "ssh"
expect = "ssh web1"

[[case]]
request = "chown -R www-data /var/www"
command = "chown"
expect = "sudo chown -R www-data /var/www"

[[case]]
request = "make alice the owner of notes.txt"
command = "chown"
expect = "sudo chown alice notes.txt"
files = ["notes.txt", "My Resume.pdf", "beach.png", "backup.sh", "report.docx", "big_video.mp4", "projects/", "projects-download.zip", "old_stuff.tar.gz", "Vacation Photos/"]

[[case]]
request = "add user alice to docker group"
command = "add user to group"
expect = "sudo usermod -aG docker alice"

[[case]]
request = "add me to the docker group"
command = "add user to group"
expect = "sudo usermod -aG docker $USER"

[[case]]
request = "add bob to the video group"
command = "add user to group"
expect = "sudo usermod -aG video bob"

[[case]]
request = "grep -ri TODO in src"
command = "grep"
expect = "grep -i -r TODO src"

[[case]]
request = "ping 8.8.8.8 5 times"
command = "ping"
expect = "ping -c 5 8.8.8.8"

[[case]]
request = "ping google.com 3 times"
command = "ping"
expect = "ping -c 3 google.com"

[[case]]
request = "extract backup.tar.gz to /opt/app"
command = "tar"
expect = "tar -xzf backup.tar.gz -C /opt/app"

[[case]]
request = "unpack old_stuff.tar.gz into /tmp/restore"
command = "tar"
expect = "tar -xzf old_stuff.tar.gz -C /tmp/restore"
files = ["notes.txt", "My Resume.pdf", "beach.png", "backup.sh", "report.docx", "big_video.mp4", "projects/", "projects-download.zip", "old_stuff.tar.gz", "Vacation Photos/"]

[[case]]
request = "tar up ./build excluding node_modules"
command = "tar"
expect = "tar -czf <archive> --exclude=node_modules ./build"

[[case]]
request = "journal for nginx since 1 hour ago"
command = "journalctl"
expect = "journalctl -u nginx --since '1 hour ago'"

[[case]]
request = "journal for sshd since yesterday"
command = "journalctl"
expect = "journalctl -u sshd --since yesterday"

[[case]]
request = "git log oneline last 10"
command = "git log"
expect = "git log --oneline -n 10"

[[case]]
request = "show commit history, only the last 5"
command = "git log"
expect = "git log --oneline -n 5"

[[case]]
request = "tail nginx error log /var/log/nginx/error.log"
command = "tail"
expect = "tail -n 10 /var/log/nginx/error.log"
files = ["nginx.conf", "README.md", "src/", "Cargo.toml", "TODO.md"]

[[case]]
request = "show the last 20 lines of /var/log/syslog"
command = "tail"
expect = "tail -n 20 /var/log/syslog"
files = ["nginx.conf", "README.md", "src/", "Cargo.toml", "TODO.md"]


# 5b. a modifier no slot can hold is reported, not dropped

[[case]]
request = "list the files excluding node_modules"
command = "ls"
expect = "ls"
note = "not included: `excluding node_modules`"

[[case]]
request = "ssh to web1 on port 2222 since yesterday"
command = "ssh"
expect = "ssh -p 2222 web1"
note = "not included: `since yesterday`"
