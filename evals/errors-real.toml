# Failures from a real-world test of `huh why` (96 failures, 22 useful fixes), with output taken
# from real runs (or realistic text where a run would need docker, pacman or an out-of-memory kill).
# Same format as errors.toml, plus:
#   exit    left out = the output was piped in, so no exit code is known.
#   forbid  words the explanation must NOT contain (a confident wrong cause).
#   files   files made in a fresh folder, "name:octalmode" (trailing "/" = folder); `$TMP` in the
#           command and output is that folder.
# fix = "nothing" asserts that there is no `Try:` line.

# --- 1. Permission denied is not always a root problem ---------------------------------------

[[case]]
command = "cat $TMP/locked.txt"
exit = 1
output = "cat: $TMP/locked.txt: Permission denied"
files = ["locked.txt:000"]
mention = ["your own file|owned by you", "read"]
forbid = ["root or administrator", "root privileges"]
fix = "chmod u+r"

[[case]]
command = "cat $TMP/locked.txt"
output = "cat: $TMP/locked.txt: Permission denied"
files = ["locked.txt:000"]
mention = ["your own file|owned by you", "locked.txt"]
forbid = ["root or administrator", "root privileges"]
fix = "chmod u+r"

[[case]]
command = "echo hi >> $TMP/notes.txt"
exit = 1
output = "bash: $TMP/notes.txt: Permission denied"
files = ["notes.txt:444"]
mention = ["your own file|owned by you", "write"]
forbid = ["root or administrator", "not executable"]
fix = "chmod u+w"

[[case]]
